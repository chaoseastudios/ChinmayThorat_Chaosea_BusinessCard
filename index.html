<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chaosea Studios | Digital Business Card</title>
    <style>
        /* BASE & ENVIRONMENT */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #050a14; 
            color: #fff; 
            overflow: hidden; 
            width: 100vw;
            height: 100vh;
            height: 100dvh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            perspective: 1200px;
            position: fixed; 
            touch-action: none; 
            overscroll-behavior: none;
        }

        /* BACKGROUND ELEMENTS */
        .bg-pattern {
            position: fixed; top: -10%; left: -10%; width: 120vw; height: 120vh; z-index: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='103.923' viewBox='0 0 60 103.923' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 103.923L0 86.6025V51.9615L30 34.641L60 51.9615V86.6025L30 103.923ZM30 101.614L58 85.448V53.115L30 36.949L2 53.115V85.448L30 101.614Z' fill='rgba(255,255,255,0.02)'/%3E%3C/svg%3E");
            animation: panBg 60s linear infinite;
            will-change: transform;
        }
        @keyframes panBg { 
            0% { background-position: 0 0; } 
            100% { background-position: -60px -103.923px; } 
        }

        .ambient-glow {
            position: fixed; top: 0; left: 0;
            width: 80vw; height: 80vh; 
            /* Slightly increased opacity for better visibility */
            background: radial-gradient(circle, rgba(10, 80, 200, 0.35) 0%, rgba(0,0,0,0) 65%);
            filter: blur(50px); z-index: 1; pointer-events: none;
            transform: translate(50vw, 50vh) translate(-50%, -50%);
            will-change: transform;
            /* Removed the conflicting CSS transition so JS can update it instantly and smoothly */
        }

        /* HOLOGRAPHIC RIPPLES */
        #ripple-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 5; overflow: hidden;
        }
        .ripple {
            position: absolute; border-radius: 50%;
            border: 1px solid rgba(100, 180, 255, 0.7);
            box-shadow: 0 0 15px rgba(100, 180, 255, 0.3), inset 0 0 10px rgba(100, 180, 255, 0.2);
            transform: translate(-50%, -50%) scale(0);
            animation: rippleAnim 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            width: 120px; height: 120px;
        }
        @keyframes rippleAnim {
            to { transform: translate(-50%, -50%) scale(1.5); opacity: 0; border-width: 0px; }
        }

        /* REACTIVE PARTICLE CANVAS */
        #particle-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2; pointer-events: none;
        }

        /* CINEMATIC INTRO SEQUENCE */
        #intro-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .intro-logo-container {
            position: relative; width: 280px; max-width: 75vw; opacity: 0; transform: scale(0.95);
            transition: all 2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .intro-logo {
            width: 100%; height: auto;
            filter: drop-shadow(0 0 20px rgba(10, 61, 145, 0.5));
        }

        .intro-text-group {
            margin-top: 30px; text-align: center; opacity: 0; transform: translateY(10px);
            transition: all 1s ease;
        }

        .greeting {
            font-size: 1rem; color: #8b9bb4; font-weight: 300; letter-spacing: 2px; margin-bottom: 6px;
        }

        .welcome {
            font-size: 1.2rem; color: #ffffff; font-weight: 400; letter-spacing: 3px; text-transform: uppercase;
            line-height: 1.4;
        }

        /* 3D CARD WRAPPER */
        #card-container {
            position: relative; z-index: 10;
            width: 92vw; max-width: 650px; aspect-ratio: 16 / 9;
            perspective: 1500px; opacity: 0; transform: translateY(20px) scale(0.95);
            transition: opacity 1.5s ease, transform 1.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #card-container.visible { opacity: 1; transform: translateY(0) scale(1); }

        /* IDLE ANIMATION */
        .idle-float { animation: floatDrift 8s ease-in-out infinite alternate; }
        @keyframes floatDrift {
            0% { transform: translateY(-4px) rotateX(1.5deg) rotateY(-1.5deg); }
            100% { transform: translateY(4px) rotateX(-1.5deg) rotateY(1.5deg); }
        }

        /* TRUE 3D CARD CONSTRUCTION */
        .card-inner {
            width: 100%; height: 100%; position: relative;
            transform-style: preserve-3d; transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: grab;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); 
            border-radius: 12px;
        }
        .card-inner:active { cursor: grabbing; }

        .card-face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            -webkit-backface-visibility: hidden; 
            border-radius: 12px; background-size: cover; background-position: center; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .card-front { 
            background-color: #0f1115; transform: translateZ(2px);
            background-image: url('card-front.png'); 
        }
        .card-back { 
            background-color: #0f1115; transform: rotateY(180deg) translateZ(2px);
            background-image: url('card-back.png'); 
        }
        
        .card-inner::before {
            content: ''; position: absolute; width: 100%; height: 100%;
            border-radius: 12px; background: #222; transform: translateZ(0px); backface-visibility: hidden;
        }

        /* BLURRED, NARROW METALLIC LIGHT SWEEP ON THE CARD */
        .card-face::after {
            content: ''; position: absolute; top: -150%; left: -150%; width: 300%; height: 300%;
            background: linear-gradient(to right, transparent 0%, rgba(255,255,255,0.2) 50%, transparent 100%);
            width: 30px; 
            filter: blur(8px); 
            transform: rotate(45deg);
            pointer-events: none;
            animation: cardShine 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            mix-blend-mode: overlay;
        }
        @keyframes cardShine {
            0%, 60% { transform: rotate(45deg) translateY(-100%) translateX(-100%); }
            100% { transform: rotate(45deg) translateY(100%) translateX(100%); }
        }

        /* INVISIBLE HITBOXES */
        .hitbox { position: absolute; cursor: pointer; z-index: 20; display: block; text-decoration: none; }
        
        .hit-name { top: 10%; left: 5%; width: 50%; height: 20%; }
        .hit-phone { top: 66%; left: 5%; width: 45%; height: 10%; }
        .hit-email { top: 76%; left: 5%; width: 60%; height: 10%; }
        .hit-web { top: 86%; left: 5%; width: 60%; height: 10%; }

        /* SOCIAL GLASS BUTTONS */
        .social-btn {
            position: absolute; bottom: 12px; width: 40px; height: 40px;
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px;
            display: flex; align-items: center; justify-content: center; z-index: 20; color: #fff;
            transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.3); cursor: pointer;
        }
        .social-btn svg { width: 18px; height: 18px; fill: currentColor; }
        
        .btn-ig { right: 12px; }
        .btn-wa { right: 60px; } 

        /* BOTTOM ACTION UI */
        #interactive-ui {
            position: absolute; bottom: 8vh; left: 50%; transform: translateX(-50%);
            opacity: 0; pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease; z-index: 50;
        }
        #interactive-ui.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(-10px); }
        
        .glass-btn {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; padding: 10px 24px;
            border-radius: 30px; font-size: 13px; font-weight: 400; letter-spacing: 1px;
            cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: all 0.3s ease;
            text-transform: uppercase;
        }

        /* TOAST NOTIFICATION */
        #toast {
            position: fixed; bottom: -60px; left: 50%; transform: translateX(-50%);
            background: rgba(20, 25, 35, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 10px 20px; border-radius: 30px;
            font-size: 12px; font-weight: 400; letter-spacing: 0.5px; opacity: 0; z-index: 1000;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); cursor: pointer; pointer-events: none;
        }
        #toast.show { bottom: 30px; opacity: 1; pointer-events: auto; }
    </style>
</head>
<body>

    <!-- Cinematic Intro -->

            <!-- FRONT -->

    <!-- UI Button (Appears only on Flip) -->
    <div id="interactive-ui">
        <div class="glass-btn" onclick="triggerAction(event, 'downloadCardLink')">Download Card</div>
    </div>

    <!-- UI Toast -->

    <script>
        // --- 0. AUDIO, RIPPLES & PERMISSIONS ---
        const AudioEngine = (function() {
            let ctx = null;
            function init() {
                if(!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
                if(ctx.state === 'suspended') ctx.resume();
            }
            function playTone(freq, type, duration, vol) {
                if(!ctx) return;
                try {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, ctx.currentTime);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    gain.gain.setValueAtTime(vol, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                    osc.start();
                    osc.stop(ctx.currentTime + duration);
                } catch(e) {}
            }
            return {
                init,
                playTick: () => playTone(600, 'sine', 0.05, 0.05),
                playFlip: () => {
                    playTone(300, 'triangle', 0.15, 0.08);
                    setTimeout(() => playTone(200, 'sine', 0.2, 0.04), 50);
                },
                playAction: () => playTone(800, 'square', 0.1, 0.04)
            };
        })();

        // Tap Ripples & Permissions
        window.addEventListener('pointerdown', (e) => { 
            AudioEngine.init(); 
            requestGyroPermission();

            // Spawn Holographic Ripple
            const rippleContainer = document.getElementById('ripple-container');
            if (rippleContainer) {
                const ripple = document.createElement('div');
                ripple.className = 'ripple';
                ripple.style.left = `${e.clientX}px`;
                ripple.style.top = `${e.clientY}px`;
                rippleContainer.appendChild(ripple);
                setTimeout(() => { if (ripple.parentNode) ripple.parentNode.removeChild(ripple); }, 800);
            }
        });

        // --- 1. STATE LOGIC & CONSTELLATION PARTICLE ENGINE ---
        let introDone = false;
        
        const CanvasEngine = (function() {
            const canvas = document.getElementById('particle-canvas');
            const ctx = canvas.getContext('2d', { alpha: false });
            let width, height;
            let particles = [];
            let mouse = { x: -1000, y: -1000, vx: 0, vy: 0 };
            
            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }

            class Particle {
                constructor() {
                    this.reset();
                    this.y = Math.random() * height; 
                }
                reset() {
                    this.x = Math.random() * width;
                    this.y = height + Math.random() * 100;
                    this.size = Math.random() * 1.5 + 0.5;
                    this.speed = Math.random() * 0.5 + 0.1;
                    this.alpha = Math.random() * 0.5 + 0.1;
                    this.vx = 0;
                    this.vy = -this.speed;
                }
                update() {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 150 && introDone) {
                        let force = (150 - dist) / 150;
                        this.vx -= (dx / dist) * force * 0.5;
                        this.vy -= (dy / dist) * force * 0.5;
                    }

                    this.vx *= 0.95;
                    this.vy = this.vy * 0.95 - this.speed * 0.05;
                    this.x += this.vx + Math.sin(Date.now() * 0.001 + this.alpha) * 0.2;
                    this.y += this.vy;

                    if (this.y < -10 || this.x < -10 || this.x > width + 10) this.reset();
                }
                draw() {
                    ctx.fillStyle = `rgba(100, 180, 255, ${this.alpha})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function init() {
                window.addEventListener('resize', resize);
                resize();
                
                // Increased particle count heavily for denser background
                for(let i=0; i<200; i++) particles.push(new Particle());
                
                window.addEventListener('pointermove', e => {
                    mouse.vx = e.clientX - mouse.x;
                    mouse.vy = e.clientY - mouse.y;
                    mouse.x = e.clientX;
                    mouse.y = e.clientY;
                });
                
                requestAnimationFrame(animate);
            }

            function animate() {
                ctx.fillStyle = '#050a14';
                ctx.fillRect(0, 0, width, height);
                
                // Draw Constellation Web
                ctx.lineWidth = 0.5;
                for (let i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw();
                    
                    for (let j = i + 1; j < particles.length; j++) {
                        let dx = particles[i].x - particles[j].x;
                        let dy = particles[i].y - particles[j].y;
                        let dist = dx*dx + dy*dy;
                        
                        if (dist < 8000) { 
                            ctx.beginPath();
                            ctx.strokeStyle = `rgba(100, 180, 255, ${0.15 * (1 - dist/8000)})`;
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(animate);
            }
            return { init };
        })();

        // --- 2. INTRO & GREETING ---
        document.addEventListener('DOMContentLoaded', () => {
            const hour = new Date().getHours();
            let greeting = 'Good Evening';
            if (hour < 12) greeting = 'Good Morning';
            else if (hour < 18) greeting = 'Good Afternoon';
            document.getElementById('greeting-text').textContent = greeting;

            runIntro();
        });

        async function runIntro() {
            CanvasEngine.init();
            
            const overlay = document.getElementById('intro-overlay');
            const logoCont = document.getElementById('logo-container');
            const textGroup = document.getElementById('intro-text');
            const cardCont = document.getElementById('card-container');

            const delay = ms => new Promise(res => setTimeout(res, ms));

            await delay(500); 
            logoCont.style.opacity = '1';
            logoCont.style.transform = 'scale(1)'; 
            
            await delay(1800);
            textGroup.style.opacity = '1';
            textGroup.style.transform = 'translateY(0)'; 

            await delay(2500);
            textGroup.style.opacity = '0';
            textGroup.style.transform = 'translateY(-10px)';
            
            logoCont.style.transition = 'all 1s cubic-bezier(0.8, 0, 0.2, 1)';
            logoCont.style.transform = 'scale(0.3) rotateX(45deg)';
            logoCont.style.opacity = '0';
            
            await delay(800);
            overlay.style.opacity = '0';
            
            cardCont.classList.add('visible');
            
            await delay(1500);
            overlay.style.display = 'none';
            introDone = true;

            autoDownloadLink();
        }

        // --- 3. 3D PHYSICS, LIGHTING, & BACKGROUND PARALLAX ---
        const card = document.getElementById('card');
        const bgPattern = document.getElementById('bg-pattern');
        const ambientGlow = document.getElementById('ambient-glow');
        
        let isFlipped = false, isDragging = false, hasDragged = false;
        let startX, startY;
        let gyroPermissionGranted = false;

        card.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
        window.addEventListener('pointercancel', onPointerUp); 

        function onPointerDown(e) {
            isDragging = true; hasDragged = false;
            
            startX = e.clientX;
            startY = e.clientY;
            
            card.classList.remove('idle-float');
            card.style.transition = 'none'; 
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            const clientX = e.clientX;
            const clientY = e.clientY;
            
            const dist = Math.sqrt(Math.pow(clientX - startX, 2) + Math.pow(clientY - startY, 2));
            if (dist > 20) hasDragged = true;

            const bounds = card.getBoundingClientRect();
            let rotateX = ((clientY - bounds.top - bounds.height / 2) / 15) * -1; 
            let rotateY = (clientX - bounds.left - bounds.width / 2) / 15;
            
            // Constrain manual rotation for consistent glint calculations
            rotateX = Math.max(-15, Math.min(15, rotateX));
            rotateY = Math.max(-15, Math.min(15, rotateY));
            
            // Link Ambient Light & Background Parallax to card rotation for perfect syncing
            if (introDone && !gyroPermissionGranted) {
                bgPattern.style.transform = `translate(${rotateY * -2}px, ${rotateX * 2}px)`;
                let glowX = window.innerWidth / 2 + (rotateY * 20);
                let glowY = window.innerHeight / 2 - (rotateX * 20);
                ambientGlow.style.transform = `translate(${glowX}px, ${glowY}px) translate(-50%, -50%)`;
            }

            if (isFlipped) rotateY += 180;
            
            applyTransform(rotateX, rotateY);
        }

        function onPointerUp(e) {
            if (!isDragging) return;
            isDragging = false;
            card.style.transition = 'transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275)';

            const isInteractiveElement = e.target.closest('.hitbox') || e.target.closest('.social-btn');

            if (!hasDragged && e.target.closest('#card') && !isInteractiveElement) {
                isFlipped = !isFlipped;
                AudioEngine.playFlip();
                if(navigator.vibrate) navigator.vibrate(40);
                
                const ui = document.getElementById('interactive-ui');
                if (isFlipped) ui.classList.add('show');
                else ui.classList.remove('show');
            } else {
                AudioEngine.playTick();
            }

            card.style.transform = isFlipped ? 'rotateY(180deg)' : 'rotateY(0deg)';
            card.style.boxShadow = '0 20px 50px rgba(0,0,0,0.6)'; 

            // Reset Glow and Parallax
            if (!gyroPermissionGranted) {
                bgPattern.style.transform = `translate(0px, 0px)`;
                ambientGlow.style.transform = `translate(50vw, 50vh) translate(-50%, -50%)`;
            }

            setTimeout(() => { if(!isDragging && !gyroPermissionGranted) card.classList.add('idle-float'); }, 800);
        }

        function applyTransform(x, y) {
            let shadowY_angle = isFlipped ? y - 180 : y;
            const shadowX = -shadowY_angle * 1.5;
            const shadowY = Math.max(20, 20 + (x * 1.5));
            
            // Amplified Dynamic Edge Glint (Effect 4 Fix)
            // Multiplying by 3 and 4 to make the inset light/shadow highly visible on screen
            const glintX = isFlipped ? -y * 3 : y * 3;
            const glintY = -x * 3;
            
            card.style.boxShadow = `
                ${shadowX}px ${shadowY}px 60px rgba(0,0,0,0.7), 
                inset ${glintX}px ${glintY}px 35px rgba(255,255,255,0.4), 
                inset ${-glintX}px ${-glintY}px 35px rgba(0,0,0,0.7)
            `;
            card.style.transform = `scale3d(1.02, 1.02, 1.02) rotate3d(1, 0, 0, ${x}deg) rotate3d(0, 1, 0, ${y}deg)`;
        }

        // --- 4. GYROSCOPE (MOBILE PARALLAX) ---
        function requestGyroPermission() {
            if (gyroPermissionGranted) return;
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(permissionState => {
                    if (permissionState === 'granted') enableGyro();
                }).catch(console.error);
            } else {
                enableGyro(); 
            }
        }

        function enableGyro() {
            if (gyroPermissionGranted) return;
            gyroPermissionGranted = true;
            window.addEventListener('deviceorientation', (e) => {
                let beta = e.beta; let gamma = e.gamma;
                if (beta === null || gamma === null) return;
                
                // Math logic corrected for typical mobile holding angle (45 degrees)
                let x = Math.max(-12, Math.min(12, (beta - 45) / 4));
                let y = Math.max(-12, Math.min(12, gamma / 3));

                // Background & Lighting Gyro Parallax perfectly matched to limits
                if (introDone) {
                    bgPattern.style.transform = `translate(${y * -2}px, ${x * 2}px)`;
                    let glowX = window.innerWidth / 2 + (y * 20);
                    let glowY = window.innerHeight / 2 - (x * 20);
                    ambientGlow.style.transform = `translate(${glowX}px, ${glowY}px) translate(-50%, -50%)`;
                }

                if (isDragging) return;
                
                if (isFlipped) y += 180;
                
                card.style.transition = 'transform 0.1s ease-out';
                applyTransform(-x, y);
            });
        }

        // --- 5. ACTIONS & DATA PAYLOADS ---
        function triggerAction(e, actionType = null) {
            e.stopPropagation(); 
            AudioEngine.playAction();
            if(navigator.vibrate) navigator.vibrate(30);
            if(actionType === 'downloadVCard') downloadVCard();
            if(actionType === 'downloadCardLink') downloadCardLink();
        }

        let pressTimer;
        function startPress(e, text) { pressTimer = window.setTimeout(() => copyText(e, text), 600); }
        function cancelPress() { clearTimeout(pressTimer); }

        function copyText(e, text) {
            e.preventDefault(); e.stopPropagation(); cancelPress();
            AudioEngine.playAction();
            if(navigator.vibrate) navigator.vibrate(40);
            navigator.clipboard.writeText(text).then(() => showToast("Copied to clipboard"));
        }

        function showToast(msg, duration = 2500) {
            const toast = document.getElementById('toast');
            toast.textContent = msg; toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, duration);
        }

        function autoDownloadLink() {
            if (!localStorage.getItem('chaoseaQRDownloaded')) {
                showToast("Download didn't start? Tap here.", 6000);
                downloadCardLink(true); 
                localStorage.setItem('chaoseaQRDownloaded', 'true');
            }
        }
        
        function manualDownload() {
            const toast = document.getElementById('toast');
            if (toast.textContent.includes("Tap here")) downloadCardLink();
        }

        function downloadVCard(silent = false) {
            const vcard = `BEGIN:VCARD\nVERSION:3.0\nN:Thorat;Chinmay;;;\nFN:Chinmay Thorat\nORG:Chaosea Studios\nTITLE:Founder & Studio Head\nTEL;TYPE=CELL,VOICE:+918879950929\nEMAIL:business@chaoseastudios.com\nURL:https://chaoseastudios.com\nEND:VCARD`;
            triggerDownloadBlob(new Blob([vcard], { type: 'text/vcard' }), 'ChinmayThorat_ChaoseaStudios.vcf');
            if(!silent) showToast("Saving Contact...");
        }

        function downloadCardLink(silent = false) {
            const targetLink = "http://chinmaythorat.chaoseastudios.com/";
            const imagePath = "CTCS_BC_QR.jpg";
            
            const a = document.createElement('a');
            a.href = imagePath;
            a.download = "Chinmay_Thorat_QR.jpg";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            const copySuccess = () => {
                if(!silent) showToast("QR Downloaded & Link Copied!");
            };
            
            const copyFallback = () => {
                const textArea = document.createElement("textarea");
                textArea.value = targetLink;
                textArea.style.position = "fixed";
                textArea.style.left = "-999999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    copySuccess();
                } catch (err) {
                    if(!silent) showToast("QR Downloaded! (Clipboard blocked by browser)");
                }
                textArea.remove();
            };

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(targetLink)
                    .then(copySuccess)
                    .catch(copyFallback);
            } else {
                copyFallback();
            }
        }

        function triggerDownloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename;
            document.body.appendChild(a); a.click();
            document.body.removeChild(a); URL.revokeObjectURL(url);
        }
    </script>
</body>
